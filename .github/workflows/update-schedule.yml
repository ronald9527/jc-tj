name: 每日竞彩足球赛程与历史赛果

on:
  schedule:
    # UTC 时间，对应北京时间 06:00 / 12:00 / 18:00 / 00:00（每天 4 次）
    # 06:00 专门覆盖凌晨结束的欧洲赛事，完赛后最多约 6 小时自动回填赛果
    - cron: '0 22 * * *'
    - cron: '0 4 * * *'
    - cron: '0 10 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 密码只存在仓库 Secret，绝不出现在日志、源码或提交内容里
      SITE_PASS: ${{ secrets.SITE_PASS }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装加密依赖
        run: python3 -m pip install --quiet cryptography

      - name: 抓取竞彩篮球赛程 / 赔率 / 赛果并加密输出
        run: python3 fetch_basketball.py

      - name: 抓取最近 10 个销售日的赛程与赛果并加密输出
        run: python3 fetch_schedule.py

      - name: 有变化才提交，自动触发 Pages 重新发布
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 明文数据文件若因任何原因出现，一律不入库
          rm -f data.json history.json
          if git diff --quiet -- data.enc history.enc basketball.enc; then
            echo "加密数据无变化，跳过提交"
          else
            git add data.enc history.enc basketball.enc
            git commit -m "自动更新加密赛程与历史赛果 $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi

      - name: 输出本次结果（用 Secret 解密，仅打印统计不打印数据）
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'.')
          from fetch_schedule import safe_load
          d=safe_load('data.enc')
          h=safe_load('history.enc')
          if not d or not h:
              print('本轮未产生可用加密数据（SITE_PASS 是否配置？）'); raise SystemExit(0)
          print('今日状态:',d.get('status'),'| 场次:',d.get('count'),'| 更新时间:',d.get('updated_at'))
          print('归档日期数:',h.get('day_count'))
          for x in h.get('days',[]):
              done=sum(1 for m in x['matches'] if m.get('result'))
              settled=sum(1 for m in x['matches'] if m.get('settled'))
              five=sum(1 for m in x['matches'] if m.get('settled') and m.get('result_bqc') and m.get('result_jqs'))
              print('  %s %s %d 场，含赛果 %d 场，自动回填 %d 场（五项齐全 %d 场）%s'%(
                    x['date'],x.get('weekday',''),x['count'],done,settled,five,x.get('num_span','')))
          PY
          b=safe_load('basketball.enc')
          if b and b.get('days'):
              s=sum(len(v.get('matches',[])) for v in b['days'].values())
              r=sum(1 for v in b['days'].values() for m in v.get('matches',[]) if m.get('settled'))
              print('篮球：%d 场已抓取，其中 %d 场已开奖 | 更新 %s'%(s,r,b.get('updated_at')))
          PY
