name: 每日竞彩篮球赛程与历史赛果

on:
  schedule:
    # UTC 时间，对应北京时间 06:00 / 12:00 / 18:00 / 00:00（每天 4 次）
    # 06:00 专门覆盖凌晨结束的欧洲赛事，完赛后最多约 6 小时自动回填赛果
    - cron: '0 22 * * *'
    - cron: '0 4 * * *'
    - cron: '0 10 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 密码只存在仓库 Secret，绝不出现在日志、源码或提交内容里
      SITE_PASS: ${{ secrets.SITE_PASS }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装加密依赖
        run: python3 -m pip install --quiet cryptography

      - name: 抓取竞彩篮球赛程 / 赔率 / 赛果并加密输出
        run: python3 fetch_basketball.py

      - name: 有变化才提交，自动触发 Pages 重新发布
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f basketball.json
          if git diff --quiet -- basketball.enc; then
            echo "篮球加密数据无变化，跳过提交"
          else
            git add basketball.enc
            git commit -m "自动更新加密竞彩篮球数据 $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi

      - name: 输出本次结果（用 Secret 解密，仅打印统计不打印数据）
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'.')
          from fetch_basketball import safe_load
          b=safe_load('basketball.enc')
          if not b:
              print('本轮未产生可用篮球加密数据（SITE_PASS 是否配置？）'); raise SystemExit(0)
          print('更新时间:', b.get('updated_at'), '| 数据源:', b.get('source'))
          for date,v in b.get('days',{}).items():
              settled=sum(1 for m in v['matches'] if m.get('settled'))
              print('  %s %d 场，已开奖 %d 场' % (date, v['count'], settled))
          PY
