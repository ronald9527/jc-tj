name: 每日竞彩篮球数据抓取

on:
  schedule:
    # 北京时间 06:00 / 12:00 / 18:00 / 00:00（与足球同步）
    - cron: '0 22 * * *'
    - cron: '0 4 * * *'
    - cron: '0 10 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-basketball
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_PASS: ${{ secrets.SITE_PASS }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装加密依赖
        run: python3 -m pip install --quiet cryptography

      - name: 运行篮球抓取脚本（抓取失败自动降级到内置数据）
        run: python3 fetch_basketball.py

      - name: 若只有明文 json，则加密为 enc
        run: |
          if [ -f basketball.json ] && [ ! -f basketball.enc ]; then
            python3 - <<'PY'
          import os, json, base64, hashlib
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          SITE_USER='admin'
          KDF_SALT=b'jc-tj-2026-static-salt-v1'
          KDF_ITER=210000
          pw=os.environ.get('SITE_PASS','')
          if not pw:
              print('警告：未配置 SITE_PASS，无法加密 basketball.json，保留明文'); raise SystemExit(0)
          key=hashlib.pbkdf2_hmac('sha256',(SITE_USER+'\x00'+pw).encode('utf-8'),KDF_SALT,KDF_ITER,32)
          data=json.load(open('basketball.json',encoding='utf-8'))
          aes=AESGCM(key); nonce=os.urandom(12)
          plain=json.dumps(data,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          wrap={"v":1,"alg":"AES-256-GCM","kdf":"PBKDF2-HMAC-SHA256","iter":KDF_ITER,
                "salt":base64.b64encode(KDF_SALT).decode(),
                "iv":base64.b64encode(nonce).decode(),
                "ct":base64.b64encode(aes.encrypt(nonce,plain,None)).decode(),"bytes":len(plain)}
          json.dump(wrap,open('basketball.enc','w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          print('[OK] 已用 SITE_PASS 加密 basketball.json -> basketball.enc')
          PY
          fi

      - name: 有变化才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f basketball.json
          if git diff --quiet -- basketball.enc 2>/dev/null; then
            echo "篮球加密数据无变化，跳过提交"
          else
            git add basketball.enc
            git commit -m "自动更新加密竞彩篮球数据 $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi

      - name: 输出统计
        run: |
          python3 - <<'PY'
          import os, json, base64, hashlib, sys
          SITE_USER='admin'
          KDF_SALT=b'jc-tj-2026-static-salt-v1'
          KDF_ITER=210000
          pw=os.environ.get('SITE_PASS','')
          def load():
              if not pw or not os.path.exists('basketball.enc'): return None
              try:
                  from cryptography.hazmat.primitives.ciphers.aead import AESGCM
                  key=hashlib.pbkdf2_hmac('sha256',(SITE_USER+'\x00'+pw).encode('utf-8'),KDF_SALT,KDF_ITER,32)
                  w=json.load(open('basketball.enc',encoding='utf-8'))
                  if not w.get('ct'): return None
                  aes=AESGCM(key)
                  plain=aes.decrypt(base64.b64decode(w['iv']),base64.b64decode(w['ct']),None)
                  return json.loads(plain.decode('utf-8'))
              except Exception as e:
                  print('解密失败:',e); return None
          d=load()
          if not d:
              print('本轮未产生可用篮球加密数据（SITE_PASS 是否配置？）'); raise SystemExit(0)
          print('更新时间:', d.get('updated_at'), '| 数据源:', d.get('source'))
          for x in d.get('days', {}).values():
              settled = sum(1 for m in x['matches'] if m.get('settled'))
              print('  %s %d 场，已开奖 %d 场' % (x['date'], x['count'], settled))
          PY
