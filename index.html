<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>竞彩预测统计 · 基础版</title>
<meta name="theme-color" content="#070d18">
<meta name="description" content="竞彩足球 / 竞彩篮球预测与统计基础版，网页与 App 同源。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="竞彩统计">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;background:#070d18;color:#e9f0fa;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","WenQuanYi Micro Hei","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:92px;background:radial-gradient(120% 60% at 50% 0%,#16263f 0%,#0a1322 55%,#070d18 100%)}
body.shell-app .app{margin-top:16px;border:1px solid #2b3d5c;border-radius:30px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.6)}
.statusbar{display:flex;justify-content:space-between;padding:10px 18px 4px;font-size:11px;color:#7f93b3;letter-spacing:.4px}
body.shell-app .statusbar{background:#101c30}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 8px;gap:8px}
.brand{font-size:19px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.brand span{color:#ffb547}
.hbtns{display:flex;gap:6px;align-items:center}
.topgo,.linkbtn,.instbtn{border:0;background:transparent;color:#ffb547;font-size:12px;font-weight:700;padding:5px 6px;white-space:nowrap}
.shell{display:flex;gap:6px;margin:6px 18px 10px;background:#0e1b2e;border:1px solid #23354f;border-radius:12px;padding:4px}
.shell button{flex:1;border:0;background:transparent;color:#8397b7;font-size:12px;padding:8px;border-radius:9px;font-weight:600}
.shell button.on{background:#1d3a5f;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.installbar{display:none;margin:0 18px 10px;padding:10px 12px;background:rgba(57,214,168,.08);border:1px solid rgba(57,214,168,.3);border-radius:12px;font-size:12px;color:#a9e9d4;align-items:center;justify-content:space-between;gap:10px}
.installbar.show{display:flex}
.installbar button{border:0;background:#39d6a8;color:#072017;font-size:12px;font-weight:800;padding:7px 10px;border-radius:9px;white-space:nowrap}
.sport{display:flex;align-items:center;justify-content:space-between;margin:4px 18px 12px;padding:14px;background:linear-gradient(100deg,#173054,#10233c);border:1px solid #2b4a72;border-radius:16px;gap:10px}
.sport h1{margin:0;font-size:17px;font-weight:800}
.sport .pg{font-size:11px;color:#8fa6c8;margin-top:3px}
.sport button{border:0;background:#ffb547;color:#1a1206;font-size:12px;font-weight:800;padding:10px 12px;border-radius:11px;white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 18px 12px}
.tab{width:100%;min-width:0;text-align:center;white-space:nowrap;border:1px solid #263a58;background:#0f1e33;color:#9db0cc;font-size:13px;padding:9px 4px;border-radius:22px;font-weight:600}
.tab.on{background:#ffb547;border-color:#ffb547;color:#1a1206;font-weight:800}
main{padding:0 18px}
.hint{font-size:12px;color:#8298b8;margin:2px 0 12px}
.card{background:#101e33;border:1px solid #233752;border-radius:15px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lg{font-size:11px;color:#7fd4ff;background:rgba(127,212,255,.09);padding:3px 8px;border-radius:6px}
.tm{font-size:11px;color:#8397b7}
.vs{font-size:15px;font-weight:800;margin:8px 0 2px}
.badge{font-size:11px;padding:3px 8px;border-radius:6px;background:rgba(255,181,71,.12);color:#ffb547}
.badge.g{background:rgba(57,214,168,.12);color:#39d6a8}
.odds{display:flex;gap:8px;margin-top:10px}
.odds div{flex:1;background:#0b1729;border:1px solid #1f324c;border-radius:10px;padding:8px;text-align:center}
.odds small{display:block;color:#7e93b2;font-size:10px;margin-bottom:4px}
.odds b{font-size:15px}
.up{color:#ff7a7a}.down{color:#39d6a8}
.bar{height:7px;background:#0b1729;border-radius:6px;margin:10px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb547,#ff7a7a);border-radius:6px}
.mini{font-size:11px;color:#8397b7;line-height:1.6}
.pick{display:flex;align-items:center;gap:10px;background:#101e33;border:1px solid #233752;border-radius:13px;padding:12px;margin-bottom:9px;cursor:pointer}
.pick.on{border-color:#ffb547;background:#1a2438}
.pick input{accent-color:#ffb547;width:16px;height:16px}
.pk-match{font-size:13px;font-weight:700;flex:1}
.pk-tip{font-size:11px;color:#8fa6c8}
.pk-odds{font-size:14px;font-weight:800;color:#ffb547;min-width:44px;text-align:right}
.calc{background:#0b1729;border:1px dashed #34527a;border-radius:14px;padding:14px;margin-top:4px;font-size:13px;line-height:2.1}
.calc b{color:#ffb547}
.stake input{width:70px;background:#13243c;border:1px solid #2c4567;color:#fff;border-radius:8px;padding:5px 8px;font-size:13px}
.ret b{font-size:18px;color:#39d6a8}
.ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ffb547,#ff7a7a);display:flex;align-items:center;justify-content:center;font-weight:800;color:#1a1206;font-size:14px}
.rate{font-size:12px;color:#39d6a8;font-weight:700}
.scoreline{display:flex;align-items:center;gap:10px;margin:9px 0}
.scoreline .s{font-size:17px;font-weight:800;min-width:52px}
.scoreline .p{flex:1;height:8px;background:#0b1729;border-radius:6px;overflow:hidden}
.scoreline .p i{display:block;height:100%;background:linear-gradient(90deg,#7fd4ff,#39d6a8)}
.scoreline .v{font-size:12px;color:#9db0cc;min-width:38px;text-align:right}
.srcbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:#8fa6c8;background:#0e1b2e;border:1px solid #23354f;border-radius:10px;padding:9px 11px;margin:2px 0 12px;line-height:1.6}
.srcbar b{color:#39d6a8;font-weight:700}
.srcbar.warn b{color:#ffb547}
.retrybtn{margin-left:auto;border:1px solid #34527a;background:#162a44;color:#7fd4ff;font-size:10px;font-weight:700;padding:5px 9px;border-radius:8px;white-space:nowrap}
.oddsmini{display:flex;gap:6px;margin-top:9px}
.oddsmini span{flex:1;background:#0b1729;border:1px solid #1f324c;border-radius:8px;padding:6px 4px;text-align:center;font-size:10px;color:#7e93b2}
.oddsmini span i{display:block;font-style:normal;font-size:13px;font-weight:800;color:#ffb547;margin-top:2px}
.mnum{font-size:10px;color:#7fd4ff;background:rgba(127,212,255,.09);padding:3px 7px;border-radius:6px}
.dayhead{display:flex;align-items:center;gap:8px;margin:14px 2px 8px;font-size:12px;color:#8fa6c8;font-weight:700}
.dayhead b{color:#ffb547;font-size:13px}
.dayhead i{flex:1;height:1px;background:#233752;font-style:normal}
.dayhead em{font-style:normal;color:#6d83a5;font-weight:500;font-size:11px}
.wd{font-size:10px;color:#39d6a8;background:rgba(57,214,168,.1);padding:3px 7px;border-radius:6px}
.noid{font-size:10px;color:#6d83a5;background:#0b1729;border:1px dashed #34527a;padding:3px 7px;border-radius:6px}
.datebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 0 12px}
.datebtn{min-width:0;text-align:center;border:1px solid #263a58;background:#0f1e33;color:#9db0cc;border-radius:10px;padding:7px 2px;font-size:10px;line-height:1.45;font-weight:600}
.datebtn b{display:block;font-size:12px;color:#dce9fb}
.datebtn small{display:block;color:#6d83a5;font-size:9px;font-weight:500}
.datebtn.on{border-color:#39d6a8;background:rgba(57,214,168,.12);color:#39d6a8}
.datebtn.on b{color:#39d6a8}
.resline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px;padding-top:9px;border-top:1px solid #1e314c}
.scorebig{font-size:19px;font-weight:800;color:#fff;letter-spacing:1px}
.rtag{font-size:10px;font-weight:800;padding:4px 9px;border-radius:7px;background:#162a44;color:#9db0cc;border:1px solid #2a4162}
.rtag.win{background:rgba(57,214,168,.14);color:#39d6a8;border-color:rgba(57,214,168,.35)}
.rtag.draw{background:rgba(255,181,71,.14);color:#ffb547;border-color:rgba(255,181,71,.35)}
.rtag.lose{background:rgba(255,110,120,.14);color:#ff8b95;border-color:rgba(255,110,120,.35)}
.rtag small{display:block;font-size:8px;font-weight:600;opacity:.75;margin-bottom:1px}
.bookline{display:grid;grid-template-columns:64px repeat(3,1fr);gap:4px;align-items:center;margin-top:5px;font-size:11px}
.bookline span:first-child{color:#6d83a5}
.bookline b{text-align:center;color:#dce9fb;background:#0f1e33;border-radius:6px;padding:4px 0;font-size:12px}
.bookhead{display:grid;grid-template-columns:64px repeat(3,1fr);gap:4px;margin:7px 0 2px;font-size:9px;color:#6d83a5;text-align:center}
.bookhead span:not(:first-child){text-align:center}
.playbtn{display:block;width:100%;margin-top:10px;padding:8px;border:1px dashed #34527a;background:#0d1b2f;color:#7fd4ff;border-radius:9px;font-size:11px;font-weight:700;text-align:center}
.playbtn.on{border-style:solid;border-color:#39d6a8;color:#39d6a8;background:rgba(57,214,168,.08)}
.playpanel{margin-top:10px;padding-top:10px;border-top:1px solid #1e314c}
.pltitle{font-size:10px;color:#8fa6c8;font-weight:700;margin:10px 0 6px}
.pltitle:first-child{margin-top:0}
.plgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.plitem{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:3px;background:#0f1e33;border:1px solid #1d304b;border-radius:7px;padding:5px 6px;font-size:10px;color:#9db0cc}
.plitem b{color:#dce9fb;font-size:11px;white-space:nowrap}
.plitem.hit{background:rgba(57,214,168,.13);border-color:rgba(57,214,168,.45)}
.plitem.hit b{color:#39d6a8}
.plnone{font-size:10px;color:#6d83a5;margin-top:8px}
.hkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.hkcol{background:#0b1729;border:1px solid #1e314c;border-radius:10px;padding:8px}
.hkhead{font-size:12px;font-weight:800;color:#dce9fb;text-align:center;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid #1e314c}
.hkhead small{display:block;font-size:9px;color:#6d83a5;font-weight:500;margin-top:2px}
.hktitle{font-size:9px;color:#6d83a5;margin:7px 0 2px;font-weight:700;letter-spacing:.5px}
.hkrow{display:flex;align-items:center;justify-content:space-between;gap:3px;font-size:10px;color:#9db0cc;padding:3px 0;border-bottom:1px dashed #17273f;flex-wrap:wrap}
.hkrow b{font-size:10px;color:#dce9fb;font-weight:700;white-space:nowrap}
.hkrow i{font-style:normal;font-size:9px;font-weight:800;white-space:nowrap}
.hkrow i.down{color:#39d6a8}
.hkrow i.up{color:#ff8b95}
.hkrow i.flat{color:#6d83a5}
.card.sync{border-color:rgba(57,214,168,.5);box-shadow:0 0 0 1px rgba(57,214,168,.12)}
.syncwarn{margin-top:9px;padding:6px 8px;border-radius:8px;background:rgba(57,214,168,.12);color:#39d6a8;font-size:11px;font-weight:800;text-align:center}
.syncwarn.calm{background:#0f1e33;color:#8fa6c8;font-weight:600}
.tagstrong{display:inline-block;padding:3px 8px;border-radius:7px;background:rgba(57,214,168,.14);color:#39d6a8;font-size:10px;font-weight:800;border:1px solid rgba(57,214,168,.35)}
.tageven{display:inline-block;padding:3px 8px;border-radius:7px;background:#0f1e33;color:#8fa6c8;font-size:10px;font-weight:700;border:1px solid #1e314c}
.stscore{display:grid;grid-template-columns:1fr 46px 1fr;gap:6px;align-items:center;margin:9px 0 4px}
.stscore .v{text-align:center;font-size:20px;font-weight:800;color:#dce9fb}
.stscore .n{font-size:10px;color:#8fa6c8;text-align:center}
.stbar{height:9px;background:#0f1e33;border-radius:6px;overflow:hidden;margin-top:3px}
.stbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#2b7de9,#39d6a8)}
.stbar.away i{background:linear-gradient(90deg,#39d6a8,#2b7de9);float:right}
.fact{display:grid;grid-template-columns:1fr 42px 48px 48px;gap:4px;font-size:10px;color:#8fa6c8;padding:4px 5px;border-bottom:1px dashed #17273f;align-items:center}
.fact.head{color:#6d83a5;font-size:9px;font-weight:700;border-bottom:1px solid #1e314c}
.fact b{text-align:center;color:#dce9fb;font-weight:700}
.fact.off b{color:#5d7191}
.intel{margin-top:9px;padding-top:8px;border-top:1px solid #1e314c}
.irow{font-size:10px;color:#9db0cc;line-height:1.6;margin:3px 0;word-break:break-all}
.irow b{color:#dce9fb}
.irow .lbl{display:inline-block;min-width:62px;color:#6d83a5}
.mini.note{margin-top:8px;color:#6d83a5;font-size:9px;line-height:1.6}
.hit{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:800}
.hit.y{background:rgba(57,214,168,.14);color:#39d6a8}
.hit.n{background:rgba(255,139,149,.12);color:#ff8b95}
.picks3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}
.picks3 button{padding:7px 2px;border:1px solid #1e314c;background:#0f1e33;color:#9db0cc;border-radius:8px;font-size:11px;font-weight:700}
.picks3 button.on{background:rgba(57,214,168,.14);border-color:#39d6a8;color:#39d6a8}
.picks3 button small{display:block;font-size:9px;opacity:.8;margin-top:2px;font-weight:500}
.rec{border-color:rgba(57,214,168,.4);box-shadow:0 0 0 1px rgba(57,214,168,.1)}
.rechit{margin-top:9px;padding:9px 10px;border-radius:9px;font-size:11px;font-weight:700;background:rgba(160,175,200,.1);color:#9db0cc;border:1px solid #2a4162;line-height:1.7}
.rechit.allhit{background:rgba(57,214,168,.14);color:#39d6a8;border-color:rgba(57,214,168,.4)}
.rechit.miss{background:rgba(255,139,149,.12);color:#ff8b95;border-color:rgba(255,139,149,.35)}
.rechit b{color:#fff;font-size:13px}
.rec.allhit{border-color:rgba(57,214,168,.5)}
.rec.miss{border-color:rgba(255,139,149,.35)}
.recchain{margin:6px 0 4px;font-size:12px;color:#9db0cc}
.recchain b{color:#dce9fb;font-size:13px}
.miniline{margin:5px 0;padding:6px 8px;border-radius:7px;background:#0b1729;border:1px solid #1e314c;font-size:9px;color:#8fa6c8;line-height:1.7}
.miniline b{color:#39d6a8}
.parlaysum{margin-top:7px;padding:6px 8px;border-radius:7px;background:rgba(255,181,71,.1);color:#ffc970;font-size:10px;font-weight:700;border:1px solid rgba(255,181,71,.25);line-height:1.7}
.settleline{margin-top:7px;padding:6px 8px;border-radius:7px;background:rgba(57,214,168,.08);color:#9fe9d0;font-size:10px;line-height:1.7;border:1px solid rgba(57,214,168,.22)}
.settleline b{color:#39d6a8}
.backnote{margin:2px 0 10px;padding:8px 10px;border-radius:9px;background:rgba(43,125,233,.12);color:#9cc4ff;font-size:10px;line-height:1.7;border:1px solid rgba(43,125,233,.3)}
.valuebar{margin-top:9px;padding:7px 9px;border-radius:8px;background:rgba(43,125,233,.12);color:#9cc4ff;font-size:10px;font-weight:700;line-height:1.7;border:1px solid rgba(43,125,233,.3)}
.valuebar.off{background:rgba(255,181,71,.1);color:#ffc970;border-color:rgba(255,181,71,.3)}
.valuebar b{color:#fff;font-size:13px}
.qrow{margin:5px 0;padding:5px 8px;border-radius:7px;background:rgba(57,214,168,.08);color:#9fe9d0;font-size:10px;line-height:1.7;border:1px solid rgba(57,214,168,.2)}
.qrow b{color:#39d6a8;font-size:12px}
details.qnote{margin:2px 0 10px;border:1px solid rgba(43,125,233,.3);border-radius:9px;background:rgba(43,125,233,.08);padding:8px 10px}
details.qnote summary{cursor:pointer;font-size:11px;font-weight:800;color:#9cc4ff;list-style:none;line-height:1.5}
details.qnote summary::-webkit-details-marker{display:none}
details.qnote summary:after{content:' ▾'}
details.qnote[open] summary:after{content:' ▴'}
.qnbody{margin-top:7px}
.qline{font-size:10px;color:#8fa6c8;line-height:1.8;padding:3px 0;border-bottom:1px dashed #1e314c}
.qline b{color:#dce9fb;margin-right:6px}


.recleg{margin-top:9px;font-size:12px;color:#dce9fb;font-weight:700;line-height:1.5}
.recpick{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0;font-size:11px;color:#8fa6c8}
.recpick b{color:#39d6a8;font-size:13px}
.recalc{margin-top:9px;padding:8px;border-radius:9px;background:rgba(57,214,168,.1);color:#9fe9d0;font-size:12px;text-align:center}
.recalc b{color:#fff;font-size:15px}
.unav{margin:2px 0 10px;padding:8px 10px;border-radius:9px;background:rgba(255,181,71,.1);color:#ffc970;font-size:10px;line-height:1.6;border:1px solid rgba(255,181,71,.25)}
details.mkt{margin-top:9px;border-top:1px solid #1e314c;padding-top:8px}
details.mkt summary{cursor:pointer;font-size:11px;font-weight:800;color:#8fa6c8;list-style:none}
details.mkt summary::-webkit-details-marker{display:none}
details.mkt summary:after{content:' ▾'}
details.mkt[open] summary:after{content:' ▴'}
.mkbody{margin-top:8px}
.mktitle{font-size:10px;color:#6d83a5;font-weight:800;margin:10px 0 4px;letter-spacing:.4px}
.mkrow{display:flex;justify-content:space-between;gap:6px;font-size:10px;color:#9db0cc;padding:3px 0;border-bottom:1px dashed #17273f;flex-wrap:wrap}
.mkrow b{color:#dce9fb;font-weight:700}
.mkbar{display:grid;grid-template-columns:62px 1fr 30px;gap:5px;align-items:center;font-size:9px;color:#8fa6c8;margin:3px 0}
.mkbar i{height:7px;background:#0f1e33;border-radius:5px;overflow:hidden;display:block}
.mkbar i b{display:block;height:100%;background:linear-gradient(90deg,#2b7de9,#39d6a8);border-radius:5px}
.mkbar em{font-style:normal;text-align:right;color:#dce9fb;font-weight:700}
.mkhalf{height:5px}
.siggrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.sig{background:#0b1729;border:1px solid #1e314c;border-radius:8px;padding:6px 7px;font-size:9px;line-height:1.5}
.sig b{display:block;color:#dce9fb;font-size:10px;margin-bottom:2px}
.sig span{color:#8fa6c8;word-break:break-all}
.settledbar{margin-top:8px;padding:5px 8px;border-radius:7px;background:rgba(57,214,168,.1);color:#39d6a8;font-size:10px;font-weight:800;border:1px solid rgba(57,214,168,.28)}
.resgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}
.rcell{background:#0b1729;border:1px solid #1e314c;border-radius:9px;padding:7px 8px;min-width:0}
.rcell.win{border-color:rgba(57,214,168,.3)}
.rcell.lose{border-color:rgba(255,139,149,.28)}
.rcell small{display:block;color:#6d83a5;font-size:9px;font-weight:700;margin-bottom:2px}
.rcell b{display:block;color:#dce9fb;font-size:14px;font-weight:800;line-height:1.3;word-break:break-all}
.rcell em{display:block;color:#8fa6c8;font-size:9px;font-style:normal;margin-top:3px;line-height:1.4}
.rcell.win b{color:#39d6a8}
.rcell.lose b{color:#ff8b95}
details.resfold{margin-top:6px}
details.resfold summary{cursor:pointer;font-size:10px;color:#8fa6c8;font-weight:700;list-style:none;line-height:1.5}
details.resfold summary::-webkit-details-marker{display:none}

/* ===== 登录解锁：仓库只存 AES-256-GCM 密文，密码不在任何公开文件里 ===== */
const AUTH_USER='admin';
const AUTH_KEY='jc_auth_v1';
const AUTH_SESS='jc_auth_v1_s';
let AUTH_READY=false;
const TE=new TextEncoder(), TD=new TextDecoder();
function b2s(u){let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
function s2b(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function authSupported(){return !!(window.crypto&&crypto.subtle&&window.TextEncoder);}
function storedAuth(){
  for(const [store,key] of [[localStorage,AUTH_KEY],[sessionStorage,AUTH_SESS]]){
    try{
      const o=JSON.parse(store.getItem(key)||'null');
      if(o&&o.k&&(!o.exp||o.exp>Date.now()))return {o,store,key};
      if(o)store.removeItem(key);
    }catch(e){}
  }
  return null;
}
function clearAuth(){
  try{localStorage.removeItem(AUTH_KEY);sessionStorage.removeItem(AUTH_SESS);}catch(e){}
}
async function importAes(rawB64){
  return crypto.subtle.importKey('raw',s2b(rawB64),{name:'AES-GCM',length:256},true,['decrypt']);
}
async function deriveAes(pass,saltB64,iter){
  const km=await crypto.subtle.importKey('raw',TE.encode(AUTH_USER+'\x00'+pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:s2b(saltB64),iterations:iter,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function decWrap(w,key){
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:s2b(w.iv)},key,s2b(w.ct));
  return JSON.parse(TD.decode(buf));
}
function showGate(msg){
  const g=document.getElementById('gate');if(!g)return;
  g.style.display='flex';
  const e=document.getElementById('gateErr');if(e)e.textContent=msg||'';
  const lo=document.getElementById('logoutBtn');if(lo)lo.style.display='none';
}
function hideGate(){
  const g=document.getElementById('gate');if(g)g.style.display='none';
  const e=document.getElementById('gateErr');if(e)e.textContent='';
  const lo=document.getElementById('logoutBtn');if(lo)lo.style.display='';
}
function getWrap(f){
  return fetch(f+'?t='+Date.now(),{cache:'no-store'})
    .then(r=>r.ok?r.json():Promise.reject(new Error(f+' '+r.status)));
}
function loadEncrypted(key,alsoProbe){
  dataLoading=true;dataError='';render();
  return Promise.all([
    getWrap('history.enc').then(w=>decWrap(w,key)).then(j=>{HIST=j;})
      .catch(()=>{HIST=null;dataError+='历史数据解密失败；';}),
    getWrap('data.enc').then(w=>decWrap(w,key)).then(j=>{LOCAL=j;LIVE=j;})
      .catch(()=>{LOCAL=null;LIVE={status:'pending'};dataError+='今日数据解密失败；';})
  ]).then(()=>{
    dataLoading=false;render();
    if(!LOCAL||!LOCAL.matches||!(LOCAL.matches||[]).length){
      clearAuth();AUTH_READY=false;
      showGate('数据无法解密：密码可能已变更，或加密数据尚未生成');
      return;
    }
    AUTH_READY=true;
    if(alsoProbe)return probeOfficial();
  });
}
async function doLogin(){
  const u=(document.getElementById('gateUser').value||'').trim();
  const p=document.getElementById('gatePass').value||'';
  const remember=document.getElementById('gateRemember').checked;
  const err=document.getElementById('gateErr');
  const btn=document.getElementById('gateGo');
  if(u!==AUTH_USER){err.textContent='账号不正确';return;}
  if(!p){err.textContent='请输入密码';return;}
  if(!authSupported()){err.textContent='当前浏览器不支持加密模块，请用 Chrome / Edge / Safari 打开';return;}
  btn.disabled=true;btn.textContent='正在解锁…';err.textContent='';
  try{
    const w=await getWrap('data.enc');
    const key=await deriveAes(p,w.salt,w.iter||210000);
    await decWrap(w,key);                    // 解密失败即密码错误
    const raw=b2s(new Uint8Array(await crypto.subtle.exportKey('raw',key)));
    clearAuth();
    const payload={k:raw,salt:w.salt};
    if(remember){payload.exp=Date.now()+7*86400000;localStorage.setItem(AUTH_KEY,JSON.stringify(payload));}
    else sessionStorage.setItem(AUTH_SESS,JSON.stringify(payload));
    hideGate();
    await loadEncrypted(key,true);
    try{
      if(location.hash==='#confirm')setTimeout(()=>{
        const c=document.getElementById('confirm');if(c&&c.scrollIntoView)c.scrollIntoView();
      },120);
    }catch(e){}
  }catch(e){
    clearAuth();
    showGate('账号或密码不正确，或数据尚未生成，请重试');
  }finally{
    btn.disabled=false;btn.textContent='解锁进入';
  }
}
function doLogout(){
  clearAuth();AUTH_READY=false;
  LIVE=null;HIST=null;LOCAL=null;dataLoading=false;
  render();renderConfirm();showGate();
}

const KEY='jczq_base_v1';
let LIVE=null, HIST=null, LOCAL=null, dataLoading=true, dataError='';
let officialFailed=false, probing=false;
let state={sport:'football',tab:0,shell:'web',histDay:'',playKey:'',picks:{},stake:20,confirmed:false,confirmAt:''};
try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function $(id){return document.getElementById(id);}

const oddsF=v=>(v===null||v===undefined||isNaN(v))?'—':(+v).toFixed(2);
function fmtOdds(o,label){
  if(!o)return '';
  return '<div class="mini" style="margin-top:8px;color:#8fa6c8">'+(label||'胜平负奖金')+' · 胜/平/负</div>'+
    '<div class="oddsmini"><span>胜<i>'+oddsF(o.h)+'</i></span><span>平<i>'+oddsF(o.d)+'</i></span><span>负<i>'+oddsF(o.a)+'</i></span></div>';
}
function oddsRow(label,o){
  if(!o)return '';
  return '<div class="mini" style="margin-top:5px">'+label+' <b style="color:#dce9fb;font-size:12px">'+
    oddsF(o.h)+' / '+oddsF(o.d)+' / '+oddsF(o.a)+'</b></div>';
}
function resultTag(v,label){
  if(!v)return '';
  const cls=v==='胜'?'win':(v==='平'?'draw':'lose');
  return '<span class="rtag '+cls+'">'+(label?'<small>'+label+'</small>':'')+v+'</span>';
}
function resultCell(name,val,prize,note){
  const cls=/胜/.test(String(val))?'win':(/负/.test(String(val))?'lose':'');
  return '<div class="rcell '+cls+'"><small>'+name+'</small><b>'+(val||'—')+'</b>'+
    (prize?'<em>中奖奖金 '+(+prize).toFixed(2)+'</em>':'<em>'+(note||'按官方口径推算')+'</em>')+'</div>';
}
function resultsGrid(x){
  // 服务端已回填的赛果优先；旧数据用前端推算兜底
  let items=x.results;
  if(!items||!items.length){
    const h=playHits(x);
    items=[
      {name:'全场比分',value:x.full||'—',prize:null,note:'90 分钟'},
      {name:'胜平负',value:x.result||scoreRes(x.full),prize:null,note:'不让球'},
      {name:'让球胜平负',value:x.result_rq||'—',prize:null,note:'让球口径'},
      {name:'半全场',value:h.bqc||'—',prize:null,note:'半场＋全场'},
      {name:'总进球',value:h.jqs||'—',prize:null,note:'7 球及以上归 7+'},
      {name:'比分',value:h.bf||'—',prize:null,note:'竞彩 31 项口径'}
    ];
  }
  return '<div class="resgrid">'+items.map(it=>resultCell(it.name,it.value,it.prize,it.note)).join('')+'</div>';
}
function isSettled(x){
  // 只在竞彩足球、且状态为已完赛时展示回填；篮球页框架占位不混入足球赛果
  return state.sport==='football' && /已完成|已结束|FT/.test(String((x&&x.st)||''));
}
function settledBlock(x,plain){
  // 6 个 Tab 共用的「完赛自动回填」六格组件，服务端 results 优先、前端推算兜底
  if(!isSettled(x))return '';
  const bar='<div class="settledbar">✅ 赛果已自动回填'+
    (x.settled_at?' · '+x.settled_at:'')+'</div>';
  if(plain)return bar+resultsGrid(x);
  return bar+'<details class="resfold" open>'+
    '<summary>六项赛果明细 · 比分 / 胜平负 / 让球 / 半全场 / 总进球 / 比分玩法（含中奖奖金）</summary>'+
    resultsGrid(x)+'</details>';
}
function scoreRes(s){
  if(!s)return '';
  const m=String(s).match(/(\d+)\s*[:：\-]\s*(\d+)/);
  if(!m)return '';
  const a=+m[1],b=+m[2];
  return a>b?'胜':(a===b?'平':'负');
}
function playHits(x){
  // 已完赛时算出各玩法中奖标签，用于高亮（推算仅用于标记，不改原赔率）
  const out={};
  if(!/已完成|已结束|FT/.test(x.st||''))return out;
  if(x.result_rq)out.rqsp=x.result_rq;
  const fm=String(x.full||'').match(/(\d+)\s*[:：]\s*(\d+)/);
  const hm=String(x.half||'').match(/(\d+)\s*[-:：]\s*(\d+)/);
  if(fm){
    const hg=+fm[1],ag=+fm[2],tot=hg+ag;
    out.jqs=tot>=7?'7+ 球':(tot+' 球');
    const key=hg+':'+ag;
    const std=['1:0','2:0','2:1','3:0','3:1','3:2','4:0','4:1','4:2','5:0','5:1','5:2',
               '0:0','1:1','2:2','3:3','0:1','0:2','1:2','0:3','1:3','2:3','0:4','1:4','2:4','0:5','1:5','2:5'];
    if(std.indexOf(key)>=0)out.bf=key;
    else out.bf=(hg>ag?'胜其它':(hg===ag?'平其它':'负其它'));
    const r2=scoreRes(x.full);
    if(hm){
      const r1=(+hm[1]>+hm[2])?'胜':((+hm[1]===+hm[2])?'平':'负');
      out.bqc=r1+r2;
    }
  }
  return out;
}
function bfGroups(bf){
  const g={'主胜':[],'平局':[],'客胜':[]};
  (bf||[]).forEach(it=>{
    const k=it.k;
    if(k==='胜其它'){g['主胜'].push(it);return;}
    if(k==='平其它'){g['平局'].push(it);return;}
    if(k==='负其它'){g['客胜'].push(it);return;}
    const m=k.match(/(\d+):(\d+)/);
    if(!m){g['主胜'].push(it);return;}
    const a=+m[1],b=+m[2];
    g[a>b?'主胜':(a===b?'平局':'客胜')].push(it);
  });
  return g;
}

function modelPick(x){
  const p=(x.intel&&x.intel.prob)||{};
  const arr=[['胜',p.h],['平',p.d],['负',p.a]].filter(y=>y[1]!==null&&y[1]!==undefined);
  if(!arr.length)return {sel:'—',why:'赔率未取到',hit:null};
  arr.sort((a,b)=>b[1]-a[1]);
  const q=x.intel||{}, why=[];
  if(q.diff!==undefined)why.push('强弱差 '+(q.diff>0?'主 +':'客 ')+Math.abs(q.diff));
  why.push('奖金隐含 '+arr[0][1]+'%');
  if(q.market_sync&&q.market_sync.length)why.push('港澳同步降水 '+q.market_sync.join('/'));
  return {sel:arr[0][0],why:why.join(' · '),hit:x.result?(x.result===arr[0][0]):null};
}

    }
    const inv=bf.map(o=>1/(o.v||1)), sum=inv.reduce((a,b)=>a+b,0);
    const list=bf.map((o,i)=>({k:o.k,p:inv[i]/sum*100})).sort((a,b)=>b.p-a.p).slice(0,8);
    const actual=x.full||'';
    html+='<div class="card"><div class="row" style="flex-wrap:wrap;gap:6px">'+
      (x.num?'<span class="mnum">'+x.num+'</span>':'')+'<span class="lg">'+x.lg+'</span>'+
      (actual?'<span class="scorebig" style="font-size:14px">'+actual+'</span>':'')+'</div>'+
      '<div class="vs" style="font-size:13px;margin:5px 0 2px">'+x.h+' <span style="color:#6d83a5">vs</span> '+x.a+'</div>'+
      list.map(o=>'<div class="scoreline"><span class="s" style="'+(o.k===actual?'color:#39d6a8;font-weight:800':'')+'">'+o.k+'</span>'+
        '<span class="p"><i style="width:'+Math.min(100,o.p*3)+'%"></i></span><span class="v">'+o.p.toFixed(1)+'%</span></div>').join('')+
      '<div class="mini note">共 '+bf.length+' 项比分奖金，显示概率最高 8 项'+(actual?' · 绿色为实际比分':'')+'</div>'+
      settledBlock(x)+'</div>';
  });
  return html;
}

// 数据双通道：① GitHub Actions 每天写入的加密 data.enc（登录后解密） ② 本机直连竞彩官方网关
// 官方网关拒绝云服务器 IP，但普通手机/家庭网络通常可直连，所以两头都试。
const OFFICIAL_URL='https://webapi.sporttery.cn/gateway/jc/football/getMatchCalculatorV1.qry?poolCode=hhad,had&channel=c';
function parseOfficial(j){
  const v=(j&&j.value)||{},out=[];
  (v.matchInfoList||[]).forEach(g=>(g.subMatchList||[]).forEach(m=>{
    const had=m.had||{},hhad=m.hhad||{};
    const num=x=>{const n=parseFloat(x);return isNaN(n)?null:n;};
    let t=(m.matchTime||'').trim();if(t.length>=5)t=t.slice(0,5);
    out.push({num:m.matchNumStr||'',lg:m.leagueAbbName||m.leagueAllName||'',
      date:m.matchDate||'',time:t,h:m.homeTeamAbbName||m.homeTeamAllName||'',
      a:m.awayTeamAbbName||m.awayTeamAllName||'',st:m.matchStatus||'',
      odds:{h:num(had.h),d:num(had.d),a:num(had.a)},line:hhad.goalLine||''});
  }));
  out.sort((x,y)=>(x.date+x.time+x.num).localeCompare(y.date+y.time+y.num));
  return {matches:out,upstream:v.lastUpdateTime||''};
}
// 官方网关不给跨域头，且拒绝机房 IP；浏览器侧并发试多条通道，谁通用谁。
// 成功后自动升级成「竞彩官方：带场次编号 + 中文队名 + 官方胜平负赔率」。
const LOTTERY_URL='https://www.lottery.gov.cn/jc/zqsgkj/';
const OFFICIAL_CHANNELS=[
  {n:'direct',      f:u=>u},
  {n:'allorigins',  f:u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u)},
  {n:'allorigins_get',f:u=>'https://api.allorigins.win/get?url='+encodeURIComponent(u)},
  {n:'codetabs',    f:u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)},
  {n:'corsproxy',   f:u=>'https://corsproxy.io/?url='+encodeURIComponent(u)},
  {n:'corslol',     f:u=>'https://api.cors.lol/?url='+encodeURIComponent(u)},
  {n:'thingproxy',  f:u=>'https://thingproxy.freeboard.io/fetch/'+u},
  {n:'corseu',      f:u=>'https://cors.eu.org/'+u},
  {n:'jina',        f:u=>'https://r.jina.ai/'+u},
];
function looseJson(t){
  t=(t||'').trim();
  try{return JSON.parse(t);}catch(e){}
  const i=t.indexOf('{'),j=t.lastIndexOf('}');
  if(i>=0&&j>i){try{return JSON.parse(t.slice(i,j+1));}catch(e){}}
  return null;
}
function unwrap(txt){
  const j=looseJson(txt);
  if(j&&typeof j.contents==='string')return j.contents;
  if(j&&j.data&&typeof j.data.contents==='string')return j.data.contents;
  return txt;
}
function parseLotteryHtml(t){
  const rows=[];
  (t.match(/<tr[^>]*>[\s\S]*?<\/tr>/gi)||[]).forEach(tr=>{
    const tds=tr.match(/<td[^>]*>[\s\S]*?<\/td>/gi)||[];
    if(tds.length<10)return;
    const c=tds.map(x=>x.replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ')
      .replace(/&amp;/g,'&').trim());
    if(!/^\d{4}-\d{2}-\d{2}$/.test(c[0])||!c[1])return;
    const p=c[3].split(/\s*VS\s*|\s*vs\s*/);
    if(p.length<2)return;
    const lm=p[0].match(/([+-]?\d+)\s*\)$/),line=lm?lm[1]:'';
    const home=p[0].replace(/\([+-]?\d+\)\s*$/,'').trim(),away=p[1].trim();
    if(!home||!away)return;
    const nf=s=>{const n=parseFloat(s);return isNaN(n)?null:n;};
    rows.push({num:c[1],weekday:c[1].slice(0,2),lg:c[2],date:c[0],time:'',
      h:home,a:away,st:c[9],half:c[4],full:c[5],
      odds:{h:nf(c[6]),d:nf(c[7]),a:nf(c[8])},line:line});
  });
  return rows;   // 官网显示什么就照抄什么，不做日期过滤
}
function timedText(url,ms){
  const c=new AbortController(),timer=setTimeout(()=>c.abort(),ms);
  return fetch(url,{signal:c.signal,cache:'no-store'})
    .then(r=>r.ok?r.text():Promise.reject(new Error('http '+r.status)))
    .finally(()=>clearTimeout(timer));
}
function anyChannel(list){
  if(typeof Promise.any==='function')return Promise.any(list);
  return list.reduce((p,next)=>p.catch(()=>next),Promise.reject());
}
function probeOfficial(){
  if(probing)return Promise.resolve();
  probing=true;
  const saved=localStorage.getItem('jc_official_channel')||'';
  const chans=OFFICIAL_CHANNELS.slice().sort((a,b)=>(a.n===saved?-1:b.n===saved?1:0));
  const u=OFFICIAL_URL+'&_='+Date.now();
  const stamp=new Date().toLocaleString('zh-CN',{hour12:false})+' (本机取数)';
  // 第一轮：官方 JSON 网关（带开赛时间、让球、赔率）
  const jsonTry=anyChannel(chans.map(ch=>timedText(ch.f(u),6500).then(txt=>{
    const j=looseJson(unwrap(txt));
    if(!j||!j.value||!j.value.matchInfoList)throw new Error('bad payload');
    const p=parseOfficial(j);
    if(!p.matches.length)throw new Error('empty');
    return {ch,p};
  })));
  // 第二轮：体彩网静态表格（场次编号、中文队名、官方胜平负赔率）
  const htmlTry=()=>anyChannel(chans.map(ch=>timedText(ch.f(LOTTERY_URL+'?_='+Date.now()),6500).then(txt=>{
    const rows=parseLotteryHtml(unwrap(txt));
    if(!rows.length)throw new Error('no rows');
    return {ch,rows};
  })));
  return jsonTry.then(({ch,p})=>{
    localStorage.setItem('jc_official_channel',ch.n);officialFailed=false;
    LIVE={status:'ok',kind:'official',source:'中国竞彩网官方赛程（'+ch.n+' 通道）',
      updated_at:stamp,upstream_time:p.upstream,count:p.matches.length,matches:p.matches};
    render();
  }).catch(()=>htmlTry().then(({ch,rows})=>{
    localStorage.setItem('jc_official_channel',ch.n);officialFailed=false;
    LIVE={status:'ok',kind:'official-page',source:'中国体彩网竞彩官方页面（'+ch.n+' 通道）',
      updated_at:stamp,upstream_time:'',count:rows.length,matches:rows};
    render();
  })).catch(()=>{
    officialFailed=true;
    render();
  }).finally(()=>{probing=false;});
}
// ① 按销售日归档的历史（含赛果与港澳盘口）② 当天赛程 ③ 后台抢官网实时数据
// 并行取、统一渲染：无论当前停在哪个 Tab，数据到了都会刷新，避免停在港澳页时卡在「暂未取到」
function loadData(alsoProbe){
  if(!/^https?:/.test(location.protocol)){dataLoading=false;render();return Promise.resolve();}
  if(!authSupported()){
    showGate('当前浏览器不支持加密模块，请用 Chrome / Edge / Safari 打开');
    return Promise.resolve();
  }
  const st=storedAuth();
  if(!st){showGate();return Promise.resolve();}
  return importAes(st.o.k).then(key=>{
    hideGate();
    return loadEncrypted(key,alsoProbe);
  }).catch(()=>{
    clearAuth();showGate('登录状态已失效，请重新输入');
    return Promise.resolve();
  });
}
